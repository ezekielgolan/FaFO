services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - workspace:/data/workspace
    environment:
      - WORKSPACE_DIR=/data/workspace
      - HOME=/data/workspace
      - PYTHONUNBUFFERED=1
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    # Flask restarts itself (debug=True) when the mounted Python source changes.
    command: ["python", "web_app.py"]
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/files', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  workspace:
